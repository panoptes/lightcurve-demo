[project]
name = "lightcurve-demo"
version = "0.2.0"
description = "An interactive web demo showing how astronomical lightcurves are created"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.scripts]
lightcurve-demo = "lc_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lc_demo.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]
