[project]
name = "lightcurve-demo"
version = "0.2.0"
description = "An interactive web demo showing how astronomical lightcurves are created"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "plotly>=5.20",
    "streamlit>=1.37",
]

[project.scripts]
lightcurve-demo = "lc_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lc_demo.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lc_demo --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["lc_demo"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def main",          # Streamlit entrypoint — tested via integration only
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
